<clipPath id="cp0"><rect class="c0" x="28" y="61" height="24" width="0"/></clipPath><text class="l0" x="28" y="78" clip-path="url(#cp0)"><tspan fill="#c7f94b">$ </tspan><tspan fill="#ffffff">npx @callstack/apex init</tspan></text><text class="l1" x="28" y="102"><tspan fill="rgba(255,255,255,.38)">┌  </tspan><tspan fill="#c7f94b">Apex CLI</tspan><tspan fill="rgba(255,255,255,.62)"> · Configure Apex for your favorite harness</tspan></text><text class="l2" x="28" y="126"><tspan fill="rgba(255,255,255,.38)">│  </tspan><tspan fill="rgba(255,255,255,.38)">Nothing is written until you confirm.</tspan></text><text class="l3" x="28" y="150"><tspan fill="#c7f94b">◆  </tspan><tspan fill="#ffffff">Set up Apex for which assistants?</tspan></text><text class="l4" x="28" y="174"><tspan fill="rgba(255,255,255,.38)">│  </tspan><tspan fill="rgba(255,255,255,.62)">◼ Claude Code   ◼ Codex   ◼ OpenCode   ◻ Cursor   ◻ Copilot</tspan></text><text class="l5" x="28" y="198"><tspan fill="rgba(255,255,255,.38)">◇  </tspan><tspan fill="#ffffff">Apply these changes? </tspan><tspan fill="#c7f94b">Yes</tspan></text><text class="l6" x="28" y="222"><tspan fill="#c7f94b">   ✔ </tspan><tspan fill="rgba(255,255,255,.62)">~/.claude/settings.json</tspan></text><text class="l7" x="28" y="246"><tspan fill="#c7f94b">   ✔ </tspan><tspan fill="rgba(255,255,255,.62)">~/.codex/callstack_ai.config.toml</tspan></text><text class="l8" x="28" y="270"><tspan fill="#c7f94b">   ✔ </tspan><tspan fill="rgba(255,255,255,.62)">~/.config/opencode/opencode.json</tspan></text><text class="l9" x="28" y="294"><tspan fill="#c7f94b">   ✓ </tspan><tspan fill="rgba(255,255,255,.62)">CALLSTACK_AUTH_TOKEN is set in this shell</tspan></text><clipPath id="cp10"><rect class="c10" x="28" y="301" height="24" width="0"/></clipPath><text class="l10" x="28" y="318" clip-path="url(#cp10)"><tspan fill="#c7f94b">$ </tspan><tspan fill="#ffffff">apex run claude</tspan></text><text class="l11" x="28" y="342"><tspan fill="rgba(255,255,255,.38)"> 